<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background: #090D16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius: 12px; border: 1px solid #1E293B;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-coupi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="grad-bank" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="grad-client" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="grad-observer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Filters for subtle glow -->
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#F59E0B"/>
    </marker>

    <!-- Animation Keyframes -->
    <style>
      .flow-line {
        stroke-dasharray: 6 6;
        animation: flowAnimation 1.5s linear infinite;
      }
      .flow-line-reverse {
        stroke-dasharray: 6 6;
        animation: flowAnimationReverse 1.5s linear infinite;
      }
      .pulse-node {
        animation: pulseLight 3s ease-in-out infinite;
      }
      .signal-dot {
        animation: signalMove 2s infinite ease-in-out;
      }
      @keyframes flowAnimation {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes flowAnimationReverse {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 24; }
      }
      @keyframes pulseLight {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 1; filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.4)); }
      }
    </style>
  </defs>

  <!-- Title Badge -->
  <rect x="30" y="24" width="940" height="44" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <circle cx="50" cy="46" r="6" fill="#10B981" />
  <text x="66" y="50" fill="#E2E8F0" font-size="14" font-weight="600" letter-spacing="0.5">COUPI PG V2 — SOVEREIGN UPI REAL-TIME PAYMENT LIFECYCLE</text>
  <text x="820" y="50" fill="#94A3B8" font-size="12">100% Cloud-Native • 0% Fees</text>

  <!-- ================= TOP ROW: PAYMENT FLOW ================= -->

  <!-- Node 1: Merchant Client (Web / Flutter) -->
  <g transform="translate(40, 100)">
    <rect width="260" height="150" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    <rect width="260" height="34" rx="10" fill="#1E293B" />
    <text x="16" y="22" fill="#A78BFA" font-size="13" font-weight="700">1. MERCHANT CLIENT</text>
    <text x="16" y="58" fill="#F8FAFC" font-size="15" font-weight="600">Web / Flutter Mobile App</text>
    <text x="16" y="80" fill="#94A3B8" font-size="12">• Checkout Button / Intent launch</text>
    <text x="16" y="100" fill="#94A3B8" font-size="12">• Passes base amount (e.g. ₹499.00)</text>
    <rect x="16" y="115" width="228" height="22" rx="4" fill="#6D28D9" fill-opacity="0.2"/>
    <text x="24" y="130" fill="#C4B5FD" font-size="11" font-family="monospace">&lt;CoupiPayButton /&gt; or coupi.js</text>
  </g>

  <!-- Animated Connection 1 -> 2 -->
  <path d="M 300 175 L 370 175" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#arrow-blue)" class="flow-line" />
  <text x="312" y="165" fill="#60A5FA" font-size="10" font-weight="600">POST /session</text>

  <!-- Node 2: CouPI Payment Engine & Paise Offset -->
  <g transform="translate(370, 90)">
    <rect width="260" height="170" rx="10" fill="#0F172A" stroke="#2563EB" stroke-width="2" class="pulse-node" />
    <rect width="260" height="34" rx="10" fill="#1E3A8A" fill-opacity="0.6" />
    <text x="16" y="22" fill="#60A5FA" font-size="13" font-weight="700">2. PAISE OFFSET ENGINE</text>
    <text x="16" y="58" fill="#F8FAFC" font-size="15" font-weight="600">CouPI Payment Core (API)</text>
    <text x="16" y="80" fill="#94A3B8" font-size="12">• Dynamic sub-rupee slot allocation</text>
    <text x="16" y="98" fill="#38BDF8" font-size="12" font-weight="600">Base ₹499.00 ➔ Unique ₹499.03</text>
    <text x="16" y="118" fill="#94A3B8" font-size="12">• Generates Vector QR + UPI intent URI</text>
    <rect x="16" y="132" width="228" height="22" rx="4" fill="#1D4ED8" fill-opacity="0.3"/>
    <text x="24" y="147" fill="#93C5FD" font-size="10" font-family="monospace">100 concurrent slots / VPA</text>
  </g>

  <!-- Animated Connection 2 -> 3 -->
  <path d="M 630 175 L 700 175" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#arrow-blue)" class="flow-line" />
  <text x="642" y="165" fill="#60A5FA" font-size="10" font-weight="600">UPI Intent</text>

  <!-- Node 3: Customer UPI App & Rails -->
  <g transform="translate(700, 100)">
    <rect width="260" height="150" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    <rect width="260" height="34" rx="10" fill="#1E293B" />
    <text x="16" y="22" fill="#34D399" font-size="13" font-weight="700">3. UPI APPS &amp; NPCI RAILS</text>
    <text x="16" y="58" fill="#F8FAFC" font-size="15" font-weight="600">GPay, PhonePe, Paytm, CRED</text>
    <text x="16" y="80" fill="#94A3B8" font-size="12">• User approves exact amount ₹499.03</text>
    <text x="16" y="100" fill="#94A3B8" font-size="12">• Direct P2P transfer over NPCI rails</text>
    <rect x="16" y="115" width="228" height="22" rx="4" fill="#065F46" fill-opacity="0.3"/>
    <text x="24" y="130" fill="#6EE7B7" font-size="11" font-weight="500">Zero intermediary holdback</text>
  </g>

  <!-- ================= MIDDLE FLOW ARROWS ================= -->
  <!-- Connection 3 -> 4 (Down to Bank) -->
  <path d="M 830 250 L 830 310" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)" class="flow-line" />
  <text x="838" y="285" fill="#34D399" font-size="11" font-weight="600">Funds Settled</text>

  <!-- ================= BOTTOM ROW: OBSERVATION & VERIFICATION ================= -->

  <!-- Node 4: Merchant Bank Account -->
  <g transform="translate(700, 310)">
    <rect width="260" height="160" rx="10" fill="#0F172A" stroke="#059669" stroke-width="1.5" />
    <rect width="260" height="34" rx="10" fill="#064E3B" />
    <text x="16" y="22" fill="#6EE7B7" font-size="13" font-weight="700">4. MERCHANT BANK ACCOUNT</text>
    <text x="16" y="58" fill="#F8FAFC" font-size="15" font-weight="600">HDFC / ICICI / SBI / Axis / Kotak</text>
    <text x="16" y="80" fill="#94A3B8" font-size="12">• Merchant account instantly credited</text>
    <text x="16" y="100" fill="#94A3B8" font-size="12">• Bank fires instant push alert email</text>
    <rect x="16" y="118" width="228" height="26" rx="4" fill="#047857" fill-opacity="0.25"/>
    <text x="24" y="135" fill="#A7F3D0" font-size="11" font-family="monospace">Subject: A/C credited INR 499.03</text>
  </g>

  <!-- Connection 4 -> 5 (Bank to Observer) -->
  <path d="M 700 390 L 630 390" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-amber)" class="flow-line-reverse" />
  <text x="635" y="380" fill="#FBBF24" font-size="10" font-weight="600">IMAP Push (&lt;400ms)</text>

  <!-- Node 5: Cloud-Native IMAP Observer -->
  <g transform="translate(370, 310)">
    <rect width="260" height="160" rx="10" fill="#0F172A" stroke="#D97706" stroke-width="1.5" />
    <rect width="260" height="34" rx="10" fill="#78350F" />
    <text x="16" y="22" fill="#FCD34D" font-size="13" font-weight="700">5. CLOUD-NATIVE OBSERVER</text>
    <text x="16" y="58" fill="#F8FAFC" font-size="15" font-weight="600">RFC 2177 IMAP IDLE Push</text>
    <text x="16" y="80" fill="#94A3B8" font-size="12">• Zero phone APKs / No SIM cards</text>
    <text x="16" y="100" fill="#94A3B8" font-size="12">• Direct TLS socket to mail server</text>
    <text x="16" y="118" fill="#94A3B8" font-size="12">• Matches exact amount &amp; 12-digit UTR</text>
    <rect x="16" y="128" width="228" height="22" rx="4" fill="#B45309" fill-opacity="0.25"/>
    <text x="24" y="143" fill="#FDE68A" font-size="10" font-family="monospace">Fast-Path UTR Fallback Active</text>
  </g>

  <!-- Connection 5 -> 6 (Observer to Fulfillment) -->
  <path d="M 370 390 L 300 390" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)" class="flow-line-reverse" />
  <text x="306" y="380" fill="#34D399" font-size="10" font-weight="600">Attributed</text>

  <!-- Node 6: Instant Fulfillment & Webhook -->
  <g transform="translate(40, 310)">
    <rect width="260" height="160" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="2" />
    <rect width="260" height="34" rx="10" fill="#065F46" />
    <text x="16" y="22" fill="#A7F3D0" font-size="13" font-weight="700">6. REAL-TIME CONFIRMATION</text>
    <text x="16" y="58" fill="#F8FAFC" font-size="15" font-weight="600">Instant Push &amp; Webhook</text>
    <text x="16" y="80" fill="#94A3B8" font-size="12">• Browser/Flutter receives SSE event</text>
    <text x="16" y="100" fill="#94A3B8" font-size="12">• HMAC-SHA256 signed POST webhook</text>
    <rect x="16" y="118" width="228" height="26" rx="4" fill="#047857" fill-opacity="0.3"/>
    <text x="24" y="135" fill="#6EE7B7" font-size="11" font-weight="600">Status: SUCCESS • Zero Delay</text>
  </g>

  <!-- Vertical Feedback Loop 6 -> 1 -->
  <path d="M 170 310 L 170 250" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-green)" />
  <text x="80" y="280" fill="#34D399" font-size="10" font-weight="600">UI Green Checkmark</text>

</svg>
