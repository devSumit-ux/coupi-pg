<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" height="100%" style="background: #090D16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius: 12px; border: 1px solid #1E293B;">
  <defs>
    <linearGradient id="grad-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <style>
      .pulse-offset {
        animation: pulseBar 2.5s ease-in-out infinite;
      }
      @keyframes pulseBar {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.01); filter: drop-shadow(0 0 6px rgba(16, 185, 129, 0.3)); }
      }
    </style>
  </defs>

  <!-- Title Badge -->
  <rect x="30" y="24" width="940" height="44" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <circle cx="50" cy="46" r="6" fill="#3B82F6" />
  <text x="66" y="50" fill="#E2E8F0" font-size="14" font-weight="600" letter-spacing="0.5">CONCURRENCY COMPARISON: LEGACY 1-USER QUEUE vs COUPI PAISE OFFSET</text>

  <!-- LEFT: Legacy YouPI-PG Bottleneck -->
  <g transform="translate(30, 90)">
    <rect width="455" height="340" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <rect width="455" height="40" rx="10" fill="#1E293B"/>
    <circle cx="20" cy="20" r="5" fill="#EF4444"/>
    <text x="35" y="24" fill="#FCA5A5" font-size="13" font-weight="700">LEGACY 1-USER QUEUE GATEWAY</text>
    <text x="310" y="24" fill="#EF4444" font-size="11" font-weight="600">STRICT 1-SLOT QUEUE</text>

    <!-- Problem Illustration -->
    <text x="20" y="70" fill="#E2E8F0" font-size="13" font-weight="600">Scenario: 5 Buyers simultaneously check out ₹499.00</text>
    <text x="20" y="90" fill="#94A3B8" font-size="11">Single fixed amount causes payment collision unless queued:</text>

    <!-- Slot 1: Active -->
    <rect x="20" y="110" width="415" height="42" rx="6" fill="#1E3A8A" fill-opacity="0.3" stroke="#3B82F6" stroke-width="1"/>
    <circle cx="36" cy="131" r="5" fill="#3B82F6"/>
    <text x="50" y="127" fill="#93C5FD" font-size="12" font-weight="600">Buyer 1: Pays ₹499.00</text>
    <text x="50" y="142" fill="#60A5FA" font-size="10">ACTIVE (Occupies sole observation slot for 5 minutes)</text>
    <rect x="340" y="120" width="85" height="22" rx="4" fill="#2563EB"/>
    <text x="354" y="135" fill="#FFFFFF" font-size="10" font-weight="600">IN PROGRESS</text>

    <!-- Slot 2: Blocked -->
    <rect x="20" y="162" width="415" height="42" rx="6" fill="#3B0764" fill-opacity="0.3" stroke="#7E22CE" stroke-width="1"/>
    <circle cx="36" cy="183" r="5" fill="#A855F7"/>
    <text x="50" y="179" fill="#E9D5FF" font-size="12" font-weight="600">Buyer 2: ₹499.00</text>
    <text x="50" y="194" fill="#C084FC" font-size="10">BLOCKED in FIFO queue — Forced to wait 5 minutes</text>
    <rect x="340" y="172" width="85" height="22" rx="4" fill="#7E22CE"/>
    <text x="350" y="187" fill="#FFFFFF" font-size="10" font-weight="600">WAITING 5m</text>

    <!-- Slot 3: Blocked -->
    <rect x="20" y="214" width="415" height="42" rx="6" fill="#450A0A" fill-opacity="0.4" stroke="#DC2626" stroke-width="1"/>
    <circle cx="36" cy="235" r="5" fill="#EF4444"/>
    <text x="50" y="231" fill="#FECACA" font-size="12" font-weight="600">Buyer 3: ₹499.00</text>
    <text x="50" y="246" fill="#F87171" font-size="10">BLOCKED in FIFO queue — Forced to wait 10 minutes</text>
    <rect x="340" y="224" width="85" height="22" rx="4" fill="#DC2626"/>
    <text x="347" y="239" fill="#FFFFFF" font-size="10" font-weight="600">WAITING 10m</text>

    <!-- Result Banner -->
    <rect x="20" y="270" width="415" height="50" rx="6" fill="#450A0A" fill-opacity="0.5" stroke="#991B1B" stroke-width="1"/>
    <text x="35" y="291" fill="#FCA5A5" font-size="11" font-weight="700">❌ RESULT: 80% CART ABANDONMENT RATE</text>
    <text x="35" y="308" fill="#F87171" font-size="10">Customers abandon checkout rather than waiting 5–15 minutes in line.</text>
  </g>

  <!-- RIGHT: CouPI PG V2 Solution -->
  <g transform="translate(515, 90)">
    <rect width="455" height="340" rx="10" fill="#0F172A" stroke="#059669" stroke-width="1.5" class="pulse-offset"/>
    <rect width="455" height="40" rx="10" fill="#064E3B"/>
    <circle cx="20" cy="20" r="5" fill="#10B981"/>
    <text x="35" y="24" fill="#A7F3D0" font-size="13" font-weight="700">COUPI PG V2 (Paise Offset Engine)</text>
    <text x="300" y="24" fill="#34D399" font-size="11" font-weight="600">100 SIMULTANEOUS / VPA</text>

    <!-- Solution Illustration -->
    <text x="20" y="70" fill="#E2E8F0" font-size="13" font-weight="600">Scenario: 5 Buyers simultaneously check out ₹499.00</text>
    <text x="20" y="90" fill="#94A3B8" font-size="11">Engine dynamically assigns unique sub-rupee offset (₹0.00 – ₹0.99):</text>

    <!-- Slot 1: Instant -->
    <rect x="20" y="110" width="415" height="42" rx="6" fill="#064E3B" fill-opacity="0.3" stroke="#059669" stroke-width="1"/>
    <circle cx="36" cy="131" r="5" fill="#10B981"/>
    <text x="50" y="127" fill="#A7F3D0" font-size="12" font-weight="600">Buyer 1: Allocated ₹499.00 (Offset +₹0.00)</text>
    <text x="50" y="142" fill="#6EE7B7" font-size="10">Pays immediately • Zero waiting queue</text>
    <rect x="340" y="120" width="85" height="22" rx="4" fill="#059669"/>
    <text x="352" y="135" fill="#FFFFFF" font-size="10" font-weight="600">IMMEDIATE</text>

    <!-- Slot 2: Instant -->
    <rect x="20" y="162" width="415" height="42" rx="6" fill="#064E3B" fill-opacity="0.3" stroke="#059669" stroke-width="1"/>
    <circle cx="36" cy="183" r="5" fill="#10B981"/>
    <text x="50" y="179" fill="#A7F3D0" font-size="12" font-weight="600">Buyer 2: Allocated ₹499.01 (Offset +₹0.01)</text>
    <text x="50" y="194" fill="#6EE7B7" font-size="10">Pays immediately • Zero waiting queue</text>
    <rect x="340" y="172" width="85" height="22" rx="4" fill="#059669"/>
    <text x="352" y="187" fill="#FFFFFF" font-size="10" font-weight="600">IMMEDIATE</text>

    <!-- Slot 3: Instant -->
    <rect x="20" y="214" width="415" height="42" rx="6" fill="#064E3B" fill-opacity="0.3" stroke="#059669" stroke-width="1"/>
    <circle cx="36" cy="235" r="5" fill="#10B981"/>
    <text x="50" y="231" fill="#A7F3D0" font-size="12" font-weight="600">Buyer 3: Allocated ₹499.02 (Offset +₹0.02)</text>
    <text x="50" y="246" fill="#6EE7B7" font-size="10">Pays immediately • Zero waiting queue</text>
    <rect x="340" y="224" width="85" height="22" rx="4" fill="#059669"/>
    <text x="352" y="239" fill="#FFFFFF" font-size="10" font-weight="600">IMMEDIATE</text>

    <!-- Result Banner -->
    <rect x="20" y="270" width="415" height="50" rx="6" fill="#064E3B" fill-opacity="0.5" stroke="#059669" stroke-width="1"/>
    <text x="35" y="291" fill="#6EE7B7" font-size="11" font-weight="700">⚡ RESULT: 100% CONVERSION &amp; DETERMINISTIC ATTRIBUTION</text>
    <text x="35" y="308" fill="#A7F3D0" font-size="10">Every transaction has a globally unique amount. No collisions, no queues.</text>
  </g>
</svg>
